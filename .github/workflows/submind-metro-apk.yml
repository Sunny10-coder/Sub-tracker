name: SubMind Metro Android 11 Inbox and Deadline APK

# Android build 10: Metro 3-section launcher widget, notes, review save fixes.

on:
  push:
    branches:
      - feature/submind-deadline-inbox-actions-20261118
    paths:
      - .github/workflows/submind-metro-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: submind-deadline-inbox-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        run: yarn install --ignore-scripts --ignore-engines --non-interactive
      - name: Verify TypeScript
        run: npx tsc --noEmit -p .
      - name: Check Instagram content tagging
        run: node scripts/check-instagram.cjs
      - name: Bundle JavaScript for Android
        run: npx expo export --platform android
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Verify native widget registration
        run: |
          test -f android/app/src/main/res/layout/submind_home_widget.xml
          test -f android/app/src/main/res/xml/submind_home_widget_info.xml
          test -f android/app/src/main/java/com/submind/metro/SubMindWidgetProvider.kt
          grep -q 'SubMindWidgetProvider' android/app/src/main/AndroidManifest.xml
          grep -q 'SubMindWidgetPackage' android/app/src/main/java/com/submind/metro/MainApplication.kt
      - name: Accept SDK licenses
        working-directory: .
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build APK for Android ARM64
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Verify APK signature and package name
        run: |
          set -e
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$apk"
          tool=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$tool"
          test -n "$aapt"
          "$tool" verify --print-certs "$apk" | tee apk-signature.txt
          "$aapt" dump badging "$apk" | grep '^package:' | tee apk-package.txt
          grep -q "name='com.submind.metro'" apk-package.txt
          sha256sum "$apk" | tee apk-sha256.txt
          ls -lh "$apk"
      - name: Upload SubMind Metro APK
        uses: actions/upload-artifact@v4
        with:
          name: SubMind-Metro-Android11-Deadline-Inbox-APK
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/apk-signature.txt
            frontend/apk-package.txt
            frontend/apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
