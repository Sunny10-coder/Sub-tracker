name: Validate SubMind Gmail precision
# Trigger the one-time pull request validation.

on:
  pull_request:
    branches:
      - feature/submind-smart-vault-20261030
    paths:
      - '.github/workflows/submind-gmail-precision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --non-interactive --no-lockfile
      - run: npx tsc --noEmit --pretty false
      - run: npx expo export --platform android --output-dir .submind-ci-dist
