name: SubMind 2.6 One-Time Integration Verification

# One-shot: only creation/edits of this workflow trigger it on the integration
# branch. Subsequent app edits do not produce automatic GitHub billing.
on:
  push:
    branches:
      - integration/claude-submind-capabilities-20261031
    paths:
      - .github/workflows/submind-integration-verify.yml

concurrency:
  group: submind-integration-once
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22
      - name: Restore dependencies without modifying committed lockfile
        run: yarn install --ignore-scripts --ignore-engines --non-interactive
      - name: TypeScript check
        run: npx tsc --noEmit -p .
      - name: Bundle app for Android
        run: npx expo export --platform android
      - name: Android native prebuild
        run: npx expo prebuild --platform android --no-install --clean
      - name: Accept Android SDK licenses
        working-directory: .
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build installable APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Verify signature and identify Gmail SHA-1
        working-directory: frontend
        run: |
          set -e
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$apk"
          tool=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$tool"
          "$tool" verify --print-certs "$apk" | tee apk-signature.txt
      - name: Upload integrated APK for device QA
        uses: actions/upload-artifact@v4
        with:
          name: SubMind-2.6-Integration-APK-Unverified-Device
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/apk-signature.txt
          if-no-files-found: error
      - name: Upload resolved lockfile for dependency reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: SubMind-2.6-Resolved-Yarn-Lock
          path: frontend/yarn.lock
          if-no-files-found: error
