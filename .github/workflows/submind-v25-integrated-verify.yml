name: Verify SubMind Gmail 3-accounts and Brain Map AI

on:
  pull_request:
    branches:
      - feature/submind-smart-vault-20261030
    paths:
      - '.github/workflows/submind-v25-integrated-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_BACKEND_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --non-interactive --no-lockfile
      - name: Gmail noise regression
        run: node --experimental-strip-types tests/gmail-classifier.test.mjs
      - name: Paid plan event and deduplication regression
        run: node --experimental-strip-types tests/mail-reconciliation.test.mjs
      - name: Strict TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Check Android native app config
        run: npx expo config --type prebuild > /dev/null
      - name: Build Android JavaScript bundle
        run: npx expo export --platform android --output-dir .submind-ci-dist
