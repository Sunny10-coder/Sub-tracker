name: Verify zero-touch Gmail SubMind
# One-off PR validation after zero-touch automatic launch integration

on:
  pull_request:
    branches:
      - feature/submind-smart-vault-20261030
    paths:
      - '.github/workflows/submind-zero-touch-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --non-interactive --no-lockfile
      - run: node --experimental-strip-types tests/gmail-classifier.test.mjs
      - run: npx tsc --noEmit --pretty false
      - run: npx expo export --platform android --output-dir .submind-ci-dist
