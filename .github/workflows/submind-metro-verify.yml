name: SubMind Android Widget & review regression verification

# Deliberately one-shot: ordinary code pushes do not trigger repeated CI jobs.
# Verify final Instagram clipboard/share handling and caption enrichment.
on:
  push:
    branches:
      - feature/submind-android-home-widget-review-fix-20261118
    paths:
      - .github/workflows/submind-metro-verify.yml

permissions:
  contents: read

jobs:
  backend-offline:
    name: Backend offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.110.1 'httpx==0.27.2' motor==3.3.1 pymongo==4.6.3 \
            pytest pytest-xdist mongomock-motor python-dotenv python-multipart requests
      - name: Python compilation
        run: python -m compileall -q backend
      - name: Offline API and parsing regression tests
        working-directory: backend
        run: python -m pytest tests/test_server_offline.py tests/test_parsing.py -q

  frontend-types:
    name: React Native TypeScript check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install frontend dependencies
        run: yarn install --ignore-scripts --ignore-engines --non-interactive
      - name: Check types
        run: npx tsc --noEmit -p .
      - name: Check Instagram link intelligence
        run: node scripts/check-instagram.cjs
